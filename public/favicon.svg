<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#18181b"/>

  <!-- Pump body -->
  <rect x="8" y="16" width="32" height="42" rx="4" fill="#e4e4e7"/>

  <!-- Pump top cap -->
  <rect x="8" y="10" width="32" height="9" rx="4" fill="#d4d4d8"/>

  <!-- Display screen -->
  <rect x="13" y="23" width="22" height="15" rx="2" fill="#27272a"/>

  <!-- Euro sign on display -->
  <text x="15" y="35" font-size="12" fill="#4ade80" font-weight="700"
        font-family="Arial, Helvetica, sans-serif">€/l</text>

  <!-- Nozzle arm (horizontal) -->
  <rect x="40" y="22" width="14" height="5" rx="2.5" fill="#d4d4d8"/>

  <!-- Nozzle pipe (vertical) -->
  <rect x="49" y="13" width="5" height="14" rx="2.5" fill="#d4d4d8"/>

  <!-- Nozzle tip -->
  <rect x="47" y="25" width="10" height="4" rx="2" fill="#a1a1aa"/>

  <!-- Base -->
  <rect x="6" y="56" width="36" height="6" rx="3" fill="#a1a1aa"/>
</svg>